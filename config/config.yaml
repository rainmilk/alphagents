# LLM Multi-Factor Stock Selection Project
# Configuration File
#
# Active config keys are marked with [ACTIVE].
# Keys marked [UNUSED] are defined here as reference/roadmap but
# are not yet read by any code path — they have no runtime effect.

# ==================== Global Random Seed [ACTIVE] ====================
# Single source of truth for reproducibility across ALL 9 baselines.
# Each baseline reads this value (the CLI `--seed` flag overrides it).
# Deterministic baselines (e.g. AlphaGrail formula evaluation) ignore it;
# the ML/RL baselines (LSTM, XGBoost x2, AlphaGen, AlphaAgent, MCTS,
# AlphaForge) seed their RNGs from it. Change one number to re-run the
# whole paper under a fresh but reproducible seed.
seed: 42

# ==================== Data Configuration [ALL ACTIVE] ====================
data:
  # Data source — loader supports westock, tushare, akshare, auto
  source: "tushare"  # tushare | akshare | westock | auto
  tushare_token: "d83808e8ee98957fe38996678210faacda9f68d8c22574f38f572704"  # set your Tushare Pro token here, or use env var TUSHARE_TOKEN

  # Optional global cap on the number of stocks to fetch.
  # Unset / null (default) => respect each universe's REAL size:
  #   hs300 = 300, zz500 = 500, all_a = 1000.
  # Set to an int ONLY if you deliberately trade coverage for fetch speed
  # (e.g. 300). When truncation happens the loader prints a WARNING — it is
  # never silent. Do NOT use this to paper over a larger universe silently.
  max_stocks: null  # e.g. 300 to cap everything at 300 for speed
  
  # Stock universe
  universe:
    index: "hs300"  # hs300, zz500, all_a
    start_date: "2020-01-01"
    end_date: "2026-06-30"
    min_market_cap: 5e9  # 5 billion
    exclude_st: true
    exclude_suspended: true
  
  # Train/Test split (CRITICAL for preventing overfitting)
  # Factors are evolved on TRAIN data, backtested on TEST data.
  # train_start_date / test_end_date bound the two windows; they default to
  # universe.start_date / universe.end_date when omitted. retrieve_dataset()
  # slices these windows out of the FULL pre-fetched archive.
  train_start_date: "2023-01-01"  # First date of training period (defaults to universe.start_date)
  train_end_date: "2024-12-31"    # Last date of training period
  test_start_date: "2025-01-01"   # First date of test period
  test_end_date: "2025-06-30"     # Last date of test period (defaults to universe.end_date)
  # If these are not set, default to 80/20 split
  
  # Context window: prepend N train days to test_data as lookback so
  # rolling-window factor expressions (ts_mean, ts_std, ts_corr, …) have
  # history on the first test date. Cropped before backtest.
  context_days: 30  # trading days; 30 covers typical max rolling window
  
  # Feature engineering
  features:
    price_features:
      - open
      - high
      - low
      - close
      - volume
      - amount
    technical_indicators:
      - ma5
      - ma20
      - ma60
      - vol
      - macd
      - rsi
    fundamental_features:
      - pe
      - pb
      - roe
      - market_cap
  
  # Preprocessing
  preprocessing:
    fill_method: "forward"  # forward, backward, interpolate
    outlier_method: "winsorize"  # winsorize, clip, none
    outlier_threshold: 3.0  # sigma for clip, percentile for winsorize

# ==================== LLM Configuration [ALL ACTIVE] ====================
llm:
  # Factor generation → used by step4_evolve_factors
  generator:
    model: "deepseek-v4-flash"
    base_url: "http://35.220.164.252:3888/v1"
    api_key: "sk-ve5dVPQ75DgivlLDKl1At0eac5MdYtwr1ztKqRsb78d9mQit"
    temperature: 0.7
    max_tokens: 4096          # [ACTIVE] mirrored by run_alphaagent / run_alphafama (was 2000; bump avoids truncation on verbose endpoints)
    # enable_thinking: the run scripts attempt extra_body={"enable_thinking": False}
    # and self-heal if the endpoint rejects it. Flip to true ONLY if you confirm
    # the model is a thinking model AND the endpoint requires explicit opt-in.
    enable_thinking: false
    
  # Multi-agent debate evaluation → used by step5_evaluate_factors
  evaluator:
    model: "tencent/Hunyuan-A13B-Instruct"
    base_url: "http://35.220.164.252:3888/v1"
    api_key: "sk-ve5dVPQ75DgivlLDKl1At0eac5MdYtwr1ztKqRsb78d9mQit"
    temperature: 0.3
    n_agents: 5        # number of debate agents (higher = more diverse opinions)
    n_debate_rounds: 3 # debate rounds per factor
    parallel_eval: true  # true = concurrent eval via ThreadPoolExecutor; false = serial (debug)

  # Chair Agent — synthesizes debate results into ranked cross-factor report
  # Used by step5b_chair_synthesis (runs after step5_evaluate_factors)
  chair:
    model: "deepseek-v4-pro"   # 当前与专家 evaluator 共用相同模型
    base_url: "http://35.220.164.252:3888/v1"
    api_key: "sk-ve5dVPQ75DgivlLDKl1At0eac5MdYtwr1ztKqRsb78d9mQit"
    temperature: 0.2  # 主席需要更确定性的输出
    # 设计理念：专家用低成本模型做大量评估，主席做最终的跨因子综合排名
    # 理想场景下 chair 应使用更强的推理模型（如 GPT-4o），当前出于成本考虑使用相同模型
    # --- Timeout / prompt bounding (fixes [Step 5b] APITimeoutError on large pools) ---
    request_timeout: 150        # [ACTIVE] seconds before a Chair LLM call times out (proxy endpoint is slow on long context)
    synthesis_top_n: 25         # [ACTIVE] #factors fed FULL detail to Chair (rest get a compact line); bounds prompt size & timeout
    max_tokens: 8192            # [ACTIVE] cap Chair generation length (compact schema + top-25 fits comfortably; bump only if truncation recurs)
    
# ==================== Evolution Configuration [ALL ACTIVE] ====================
evolution:
  forward_period: 10   # [ACTIVE] forward return horizon in trading days (aligned with all other baselines)
  n_seeds_hypothesis: 15        # [ACTIVE] hypothesis-driven seed factors (Stage1→Stage2); produced whenever > 0
  n_seeds_single_stage: 15       # [ACTIVE] plain single-stage seed factors
  n_seeds_memory_augment: 20     # [ACTIVE] memory-augmented seed factors (consumed by MemoryAugmentedGenerator; 0 = off)
  n_shots: 5                   # [ACTIVE] few-shot examples injected into the LLM prompt by MemoryAugmentedGenerator (retrieval count; INDEPENDENT of memory.retrieval.top_k which is for factor-pool merge)
  n_best_factors: 25   # [ACTIVE] top-N factors to retain per round
  max_rounds: 15       # [ACTIVE] max evolution rounds (overridable via CLI --n-evolution-rounds)
  n_improve: 20        # [ACTIVE] target number of improved factors per round (LLM generation)
  n_mutate: 5          # [ACTIVE] mutation variations per top factor (rule-based fallback)
  convergence_delta: 0.003  # [ACTIVE] min IC improvement to continue (below this = converged)
  convergence_window: 2     # [ACTIVE] number of recent rounds to check for convergence
  patience: 3               # [ACTIVE] max consecutive non-improving rounds before early stop
  val_ratio: 0.3            # [ACTIVE] fraction of TRAIN period held out as validation for factor SELECTION and early-stop (0 = disabled; full train used as before). This is the key anti-overfitting lever: evolution is driven by train IC but factors are finally ranked/early-stopped on validation IC.
  min_ic: 0.02              # [ACTIVE] quality filter: drop factors with IC below this
  min_val_ic: 0.02         # [ACTIVE] honest gate (val-mode only): drop factors whose validation IC < this. Requires a real OOS edge — at val_ratio=0.3 the holdout window is ~hundreds of days (SE of mean val-IC ≈ 0.005), so 0.01 ≈ "factor must show a small but statistically-meaningful rank-IC on holdout" (~2 SE above zero). Set 0.005 for a more lenient bar; avoid 0.02 (= min_ic) unless you want val IC to match the in-sample floor (too strict given holdout noise).
  min_sharpe: 0.0           # [ACTIVE] soft guard: drop factors with NEGATIVE Sharpe. NOTE: Sharpe here is distorted by overlapping-window annualization (daily-sampled 10d forward returns * sqrt(252)), so keep this a soft floor, not a hard gate. Was 0.5 — dead code: it constantly cleared every factor, then the fallback re-admitted all of them, so the filter never excluded anything.
  max_drawdown: -1.0       # [ACTIVE] quality filter: drop factors with drawdown worse than this. Cumsum-based after fix (single-sided 10d LS returns); -0.20 was too strict for 2023-2024 A-share bear market — even decent factors easily exceed -20% cumulative.
  originality_gate: true    # [ACTIVE] static AST gate: reject structural near-duplicates + trivial/no-data/constant-dominated factors before they enter the pool
  dedup_similarity: 0.90    # [ACTIVE] canonical-signature similarity above which a factor is treated as a near-duplicate of an accepted one
  improve_temperature: 0.6  # [ACTIVE] LLM temperature for factor IMPROVEMENT (NOT seed generation). Diversity is now driven by the improve-prompt family-rotation + operator-diversity rules, so 0.7 balances refinement vs exploration. The old 0.8 (with no prompt-side diversity guard) caused fresh-lottery collapse.
  elitism_carry: 3          # [ACTIVE] number of top factors carried forward unmutated each round. Breaks the "full replacement" cycle that collapses the pool to a single direction.

# ==================== Memory Bank Configuration ====================
memory:
  # Market state encoding → used by MarketEncoder (step1 init)
  market_state:
    recent_days: 60    # [ACTIVE] recent data window for encoding current market state
    vix_low: 15.0      # [ACTIVE]
    vix_high: 25.0     # [ACTIVE]
    ma_short: 20       # [ACTIVE]
    ma_long: 60        # [ACTIVE]
    corr_threshold_low: 0.3   # [ACTIVE]
    corr_threshold_high: 0.6  # [ACTIVE]
  
  # Retrieval → used by step4b_retrieve_from_memory
  retrieval:
    top_k: 5           # [ACTIVE] number of factors to retrieve from memory per query
    state_weight: 0.3  # [ACTIVE] weight of market-state similarity vs semantic similarity
    min_ic: 0.02       # [ACTIVE] minimum IC threshold to filter retrieved factors

  # Save gate → used by step5 save loop (main.py). Factors below this train IC
  # are NOT persisted to the memory bank, so low-quality factors don't accumulate
  # and get re-fed into future pools via Step 4b retrieval. Set 0.0 to disable.
  save_min_ic: 0.02    # [ACTIVE] minimum train IC to persist a freshly-evolved factor

  # Update → used by MemoryBank.update_quality / _update_existing_factor
  update:
    alpha: 0.3  # [UNUSED] EMA decay factor — currently hardcoded as 0.3 in memory.py
    
  # Storage → used by MemoryBank (step1 init)
  storage:
    db_path: "data/memory_bank"     # [ACTIVE]
    faiss_path: "data/memory_bank"  # [ACTIVE]
  
  # Embedder → used by FactorEmbedder (step1 init)
  encoder:
    model: "paraphrase-multilingual-MiniLM-L12-v2"  # [ACTIVE] sentence-transformers model for factor embedding
    device: "cuda"              # [ACTIVE] cuda | cpu

# ==================== Fusion Configuration [ALL ACTIVE] ====================
fusion:
  # Normalization → used by FactorNormalizer in step6 (FactorFusion) and step7 (portfolio)
  normalization:
    method: "zscore"  # zscore | rank | minmax
    neutralize_industry: true  # cross-sectional industry-dummy residualization

  # Weighting strategy → used by FactorFusion in step6_fuse_factors
  weighting:
    strategy: "icir2_shrinkage"  # equal | ic_weighted | icir_weighted | decay_weighted | icir2_shrinkage
    corr_penalty: true           # whether to apply correlation-based redundancy penalty
    corr_threshold: 0.7          # correlation threshold for redundancy detection
    # ICIR² shrinkage hyperparameters (for icir2_shrinkage strategy)
    regime_tilt_strength: 0.2    # regime tilt magnitude (0=disabled, 0.2=moderate, 0.5=aggressive)
    shrinkage_kappa: 0.3         # debate prior confidence [0,1] (0=no prior, 1=full prior)
    ipr_alpha: 2.0               # IPR penalty sensitivity (higher = more aggressive redundancy penalty)

  # Step 5b Chair selection → used by step6_fuse_factors
  # When true, ONLY the factors the Chair Agent explicitly RANKED in step5b
  # enter the fusion pool; factors the Chair REJECTED are dropped. This makes
  # the Chair's selection/rejection actually take effect (instead of being a
  # no-op report, which previously caused "Selected 5 / Fused 13" confusion).
  # Set false to keep the legacy behaviour (fuse all best_factors regardless).
  use_chair_selection: true

  # ── Chair strictness controls (only used when use_chair_selection: true) ──
  # Fixes "Step 5b rejects 11/15 — is that too strict?". The Chair REJECTED
  # factors with final_score (8.0) HIGHER than some SELECTED ones (7.8) purely
  # for family overlap, yet hard-dropped them at only MEDIUM confidence.
  chair_max_per_family: 3        # [ACTIVE] family-diversity cap fed to the Chair prompt (was hardcoded "2-3"). Raise to 4-5 to let a dominant family keep more variants.
  chair_soft_reject: true        # [ACTIVE] true = rejected factors are DOWNWEIGHTED (kept in fusion with a reduced prior), not hard-dropped. Prevents a MEDIUM-confidence Chair from permanently discarding a high-IC factor.
  chair_soft_reject_weight: 0.3  # [ACTIVE] debate_score multiplier for soft-rejected factors (0 = drop the prior entirely, 1 = no penalty).

  # Final cap on the number of factors that actually ENTER fusion (applied LAST,
  # on top of Chair selection / soft-reject). 0 = no cap (legacy behaviour:
  # fuse every Chair-surviving factor). >0 = keep only the top-K factors ranked
  # by the fusion prior — Chair final_score when use_chair_selection is on,
  # else the multi-agent debate_score. This is the "final Chair-screened top-K"
  # the user wants to feed fusion.fuse(). NOTE: this is a different knob from
  # memory.retrieval.top_k (factor-pool retrieval) and llm.chair.synthesis_top_n
  # (how many factors get full detail in the Chair prompt).
  top_k: 15

  # Portfolio construction → used by step7_construct_portfolio
  portfolio:
    top_n: 50                     # number of stocks to hold
    method: "score_proportional"  # top_n | score_proportional
    max_weight: 0.05              # single-stock weight cap
    max_industry_exposure: 0.30   # single-industry weight cap
    min_market_cap_percentile: 10 # exclude bottom percentile by market cap

# ==================== Backtest Configuration ====================
backtest:
  # Trading → used by BacktestEngine (step8_backtest)
  trading:
    commission: 0.001     # [ACTIVE] 0.1% one-sided (paper-aligned)
    slippage: 0.0        # [ACTIVE] 0% (disabled; cost in commission)
    holding_period: 5      # [ACTIVE] days between rebalances: 1=daily, 5=weekly, 20=monthly

    # --- Unused keys ---
    frequency: "daily"     # [UNUSED] rebalance is controlled solely by holding_period above
    min_holding_days: 1    # [UNUSED] not read by any code

  # Rebalancing → entire section is unused; holding_period (above) is the sole control
  rebalance:
    frequency: "weekly"       # [UNUSED]
    lookback_window: 20       # [UNUSED]

  # Benchmark
  benchmark:
    name: "hs300"          # [UNUSED] benchmark is passed directly as a constructor argument


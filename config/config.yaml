# AAAI 2027 LLM Multi-Factor Stock Selection Project
# Configuration File

# ==================== Data Configuration ====================
data:
  # Data source
  source: "tushare"  # or "akshare", "westock", "qlib", "auto"
  tushare_token: "d83808e8ee98957fe38996678210faacda9f68d8c22574f38f572704"  # set your Tushare Pro token here, or use env var TUSHARE_TOKEN
  
  # Qlib config (used when source="qlib" or "auto")
  qlib:
    provider_uri: "qlib_data/cn_data"  # Qlib data directory (auto-download if missing)
    auto_download: true  # auto-download cn_data if not found
  
  # Stock universe
  universe:
    index: "hs300"  # hs300, zz500, all_a
    start_date: "2019-01-01"
    end_date: "2025-12-31"
    min_market_cap: 5e9  # 5 billion
    exclude_st: true
    exclude_suspended: true
  
  # Train/Test split (CRITICAL for preventing overfitting)
  # Factors are evolved on TRAIN data, backtested on TEST data
  train_end_date: "2023-12-31"  # Last date of training period
  test_start_date: "2024-01-01"  # First date of test period
  # If these are not set, default to 80/20 split
  
  # Feature engineering
  features:
    price_features:
      - open
      - high
      - low
      - close
      - volume
      - amount
    technical_indicators:
      - ma5
      - ma20
      - ma60
      - vol
      - macd
      - rsi
    fundamental_features:
      - pe
      - pb
      - roe
      - market_cap
  
  # Preprocessing
  preprocessing:
    fill_method: "forward"  # forward, backward, interpolate
    outlier_method: "winsorize"  # winsorize, clip, none
    outlier_threshold: 3.0  # sigma for clip, percentile for winsorize

# ==================== LLM Configuration ====================
llm:
  # Factor generation
  generator:
    model: "bailian/deepseek-v4-flash"
    base_url: "http://35.220.164.252:3888/v1"
    api_key: "sk-ve5dVPQ75DgivlLDKl1At0eac5MdYtwr1ztKqRsb78d9mQit"
    temperature: 0.7
    max_tokens: 2000
    
  # Factor evaluation (debate)
  evaluator:
    model: "bailian/deepseek-v4-flash"
    base_url: "http://35.220.164.252:3888/v1"
    api_key: "sk-ve5dVPQ75DgivlLDKl1At0eac5MdYtwr1ztKqRsb78d9mQit"
    temperature: 0.3
    n_agents: 5
    n_debate_rounds: 3
    parallel_eval: true   # true = 5 agents evaluate concurrently (ThreadPoolExecutor); false = serial for debugging

  # Chair Agent (仲裁 / 跨因子综合报告)
  # 设计理念：5位专家用低成本模型（DeepSeek），主席用强推理模型（GPT-4o）
  # 主席负责：分歧仲裁 + 所有因子的综合排名 + 入选/淘汰理由
  chair:
    model: "bailian/deepseek-v4-flash"              # 理想: gpt-4o；当前使用与专家相同模型
    base_url: "http://35.220.164.252:3888/v1"
    api_key: "sk-ve5dVPQ75DgivlLDKl1At0eac5MdYtwr1ztKqRsb78d9mQit"
    temperature: 0.2  # 主席需要更确定性的输出
    
# ==================== Evolution Configuration ====================
evolution:
  forward_period: 20  # forward return horizon in trading days (factor evaluation)
  n_seeds: 10  # number of candidate factors per round
  n_best_factors: 10
  n_improve: 10
  n_mutate: 5
  max_rounds: 15
  convergence_delta: 0.003
  convergence_window: 2
  patience: 3
  
  # Quality threshold
  min_ic: 0.02
  min_sharpe: 0.5
  max_drawdown: -0.20

# ==================== Memory Bank Configuration ====================
memory:
  # Market state encoding
  market_state:
    recent_days: 60    # recent data window for encoding current market state
    vix_low: 15.0
    vix_high: 25.0
    ma_short: 20
    ma_long: 60
    corr_threshold_low: 0.3
    corr_threshold_high: 0.6
  
  # Retrieval
  retrieval:
    top_k: 5
    state_weight: 0.3
    min_ic: 0.02
    
  # Update
  update:
    alpha: 0.3  # EMA decay
    
  # Storage
  storage:
    db_path: "data/memory_bank"
    faiss_path: "data/memory_bank"
  
  # Embedder
  encoder:
    model: "all-MiniLM-L12-v2"
    device: "cuda"

# ==================== Fusion Configuration ====================
fusion:
  # Normalization
  normalization:
    method: "zscore"  # zscore, rank, minmax
    neutralize_industry: true
    
  # Weighting strategy
  weighting:
    strategy: "icir_weighted"  # equal, ic_weighted, icir_weighted, decay
    corr_penalty: true
    corr_threshold: 0.7
    
  # Portfolio construction
  portfolio:
    top_n: 50
    method: "score_proportional"  # top_n, score_proportional
    max_weight: 0.05
    max_industry_exposure: 0.30
    min_market_cap_percentile: 10

# ==================== Backtest Configuration ====================
backtest:
  # Trading
  trading:
    frequency: "daily"  # daily, weekly, monthly
    commission: 0.0003  # 0.03%
    slippage: 0.001  # 0.1%
    min_holding_days: 1
    
  # Rebalancing
  rebalance:
    frequency: "weekly"  # daily, weekly, monthly
    lookback_window: 20  # trading days
    
  # Benchmark
  benchmark:
    name: "hs300"

  # Qlib backtesting engine (optional, pip install qlib)
  qlib:
    enable: false         # set to true to use Qlib for backtesting
    topk: 50              # number of stocks in portfolio
    n_drop: 5             # stocks replaced per rebalance
    limit_threshold: 0.095  # A-share price limit (9.5%)
    hold_thresh: 1        # minimum holding days
    freq: "day"           # rebalance frequency ("day" or "week")

# ==================== Experiment Configuration ====================
experiment:
  # Cross-validation
  cv:
    method: "rolling"  # rolling, expanding, kfold
    n_splits: 5
    train_window: 252  # trading days
    test_window: 63  # trading days
    
  # Baselines
  baselines:
    - "equal_weight"
    - "ic_weighted"
    - "alpha_grail"
    - "gpt_factor"
    
  # Metrics
  metrics:
    - "annual_return"
    - "sharpe_ratio"
    - "max_drawdown"
    - "information_ratio"
    - "calmar_ratio"
    - "win_rate"

# ==================== Logging Configuration ====================
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  save_dir: "logs"
  save_frequency: 10  # save every N rounds

# ==================== Output Configuration ====================
output:
  # Results
  results_dir: "experiments/results"
  
  # Paper
  paper_dir: "paper"
  figures_dir: "paper/figures"
  
  # Feishu sync
  feishu:
    enable: true
    doc_ids:
      plan: "KJbhdd3HjoF4uIxpf0jcWOhdnMb"
      debate: "OUIFdytglogDzhxv7bQcciTmnQu"
      evolve: "P5mSdE0ALo0LbDxyNVAcBHmRnze"
      memory: "H6XcdhqHOoSRK8x3elXc8FHJnBb"
      fusion: "LX25dNu5roi3mjxL7npcMv6Kn7g"
